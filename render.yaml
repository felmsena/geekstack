databases:
  - name: geekstack-db
    databaseName: geekstack_production
    user: geekstack
    plan: free

services:
  - type: web
    name: geekstack
    runtime: ruby
    plan: free
    buildCommand: |
      bundle install &&
      bundle exec rails assets:precompile &&
      bundle exec rails spree:admin:tailwindcss:build
    startCommand: bundle exec puma -C config/puma.rb
    preDeployCommand: bundle exec rails db:migrate
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: BUNDLE_WITHOUT
        value: "development:test"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "2"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: geekstack-db
          property: connectionString
